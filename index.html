<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>住所コード検索</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #06080c;
            --bg-card: #0d1117;
            --bg-modal: #111720;
            --border: rgba(255,255,255,0.06);
            --text: #e6edf3;
            --text-muted: #8b949e;
            --text-dim: #484f58;
            --primary: #6C9CFF;
            --accent-purple: #c084fc;
            --accent-green: #4ade80;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px 16px 40px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .header { text-align: center; padding: 24px 0 8px; }
        .header h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, var(--primary), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p { color: var(--text-dim); font-size: 12px; margin-top: 4px; }

        /* Region grid */
        .region-group { margin-bottom: 16px; }
        .region-group-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 8px;
            padding-left: 2px;
        }
        .region-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .region-btn {
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-card);
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s;
        }
        .region-btn:hover { border-color: var(--primary); color: var(--text); background: rgba(108,156,255,0.06); }
        .region-btn:active { transform: scale(0.96); }
        .region-btn.loading { opacity: 0.5; pointer-events: none; }

        /* Fixed Result Bar */
        .result-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(6, 8, 12, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 10px 16px;
            display: none;
            cursor: pointer;
        }
        .result-bar.show { display: block; }
        .result-bar-inner {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .result-bar-code {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 0.03em;
            flex-shrink: 0;
        }
        .result-bar-info { flex: 1; min-width: 0; }
        .result-bar-addr {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .result-bar-detail { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
        .result-tag {
            padding: 2px 8px;
            border-radius: 5px;
            font-size: 10px;
            font-family: monospace;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            color: var(--text-dim);
        }
        .result-bar-hint {
            font-size: 10px;
            color: var(--text-dim);
            text-align: right;
            flex-shrink: 0;
        }

        /* === Modal === */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 500;
            justify-content: center;
            align-items: flex-end;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            width: 100%;
            max-width: 600px;
            max-height: 85vh;
            background: var(--bg-modal);
            border-radius: 16px 16px 0 0;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.25s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px 12px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .modal-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
        }
        .modal-close {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.06);
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }
        .modal-close:hover { background: rgba(255,255,255,0.1); color: var(--text); }

        /* Modal steps */
        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }
        .modal-body::-webkit-scrollbar { width: 6px; }
        .modal-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

        .step { display: none; }
        .step.active { display: block; }

        .step-search {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--bg-modal);
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
        }
        .step-search input {
            width: 100%;
            padding: 10px 12px 10px 34px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            outline: none;
        }
        .step-search input:focus { border-color: var(--primary); }
        .step-search input::placeholder { color: var(--text-dim); }
        .step-search-wrap { position: relative; }
        .step-search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            font-size: 14px;
            pointer-events: none;
        }
        .step-count {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 6px;
        }

        .list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            cursor: pointer;
            transition: background 0.1s;
            font-size: 14px;
            border-bottom: 1px solid var(--border);
        }
        .list-item:hover { background: rgba(255,255,255,0.03); }
        .list-item:active { background: rgba(108,156,255,0.08); }
        .list-item-name { color: var(--text); }
        .list-item-sub { font-size: 12px; color: var(--text-dim); }
        .list-item-code {
            font-family: monospace;
            font-size: 12px;
            color: var(--text-dim);
            flex-shrink: 0;
            margin-left: 12px;
        }
        .list-item-arrow { color: var(--text-dim); font-size: 12px; flex-shrink: 0; margin-left: 8px; }

        /* Modal result */
        .modal-result {
            text-align: center;
            padding: 32px 20px;
        }
        .modal-result-code {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 42px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 0.03em;
        }
        .modal-result-addr {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 8px;
        }
        .modal-result-tags {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .modal-result-tag {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-family: monospace;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            color: var(--text-muted);
        }
        .modal-result-btns {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 20px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: rgba(255,255,255,0.04);
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn:hover { background: rgba(255,255,255,0.08); }
        .btn:active { transform: scale(0.97); }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent-purple));
            border: none;
            color: #fff;
            font-weight: 600;
        }

        /* Back button in modal */
        .modal-back {
            border: none;
            background: none;
            color: var(--primary);
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .modal-back:hover { opacity: 0.8; }

        /* Loading */
        .loading-msg {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-dim);
            font-size: 13px;
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.15);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-bottom: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--accent-green);
            color: #000;
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 10000;
            pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .footer { text-align: center; color: var(--text-dim); font-size: 11px; }
        .footer a { color: var(--primary); text-decoration: none; }
        .source-note { font-size: 10px; color: var(--text-dim); margin-top: 4px; }
    </style>
</head>
<body>
    <!-- Fixed Result Bar (shown after selection) -->
    <div class="result-bar" id="resultBar" onclick="copyCode()">
        <div class="result-bar-inner">
            <div class="result-bar-code" id="barCode"></div>
            <div class="result-bar-info">
                <div class="result-bar-addr" id="barAddr"></div>
                <div class="result-bar-detail" id="barDetail"></div>
            </div>
            <div class="result-bar-hint">tap to copy</div>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <h1>住所コード検索</h1>
            <p>自動車登録用 — 管轄を選んでパパッと検索</p>
        </div>

        <!-- Region buttons -->
        <div id="regionList"></div>

        <div class="footer">
            <span>Made by <a href="https://mochi-bullet-magazine.vercel.app/" target="_blank">MochiBullet</a></span>
            <div class="source-note">データ出典: <a href="https://www.kodokensaku.mlit.go.jp/motas/" target="_blank">国土交通省 自動車登録関係コード検索システム</a></div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <button class="modal-back" id="modalBack" style="visibility:hidden;">← 戻る</button>
                <div class="modal-title" id="modalTitle">読み込み中...</div>
                <button class="modal-close" id="modalClose">✕</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
    const regions = [
        { group: '北海道', offices: [
            { name: '札幌', file: 'sapporo' }, { name: '函館', file: 'hakodate' }, { name: '旭川', file: 'asahikawa' },
            { name: '室蘭', file: 'muroran' }, { name: '釧路', file: 'kushiro' }, { name: '帯広', file: 'obihiro' }, { name: '北見', file: 'kitami' }
        ]},
        { group: '東北', offices: [
            { name: '青森', file: 'aomori' }, { name: '八戸', file: 'hachinohe' }, { name: '岩手', file: 'iwate' },
            { name: '宮城', file: 'miyagi' }, { name: '秋田', file: 'akita' }, { name: '山形', file: 'yamagata' },
            { name: '庄内', file: 'shonai' }, { name: '福島', file: 'fukushima' }, { name: 'いわき', file: 'iwaki' }
        ]},
        { group: '関東', offices: [
            { name: '茨城', file: 'ibaraki' }, { name: '土浦', file: 'tsuchiura' }, { name: '栃木', file: 'tochigi' },
            { name: '佐野', file: 'sano' }, { name: '群馬', file: 'gunma' }, { name: '埼玉', file: 'saitama' },
            { name: '所沢', file: 'tokorozawa' }, { name: '熊谷', file: 'kumagaya' }, { name: '春日部', file: 'kasukabe' },
            { name: '千葉', file: 'chiba' }, { name: '習志野', file: 'narashino' }, { name: '袖ヶ浦', file: 'sodegaura' },
            { name: '野田', file: 'noda' }, { name: '東京', file: 'tokyo' }, { name: '練馬', file: 'nerima' },
            { name: '足立', file: 'adachi' }, { name: '八王子', file: 'hachioji' }, { name: '多摩', file: 'tama' },
            { name: '横浜', file: 'kanagawa' }, { name: '川崎', file: 'kawasaki' }, { name: '湘南', file: 'shonan' },
            { name: '相模', file: 'sagami' }, { name: '山梨', file: 'yamanashi' }
        ]},
        { group: '北陸信越', offices: [
            { name: '新潟', file: 'niigata' }, { name: '長岡', file: 'nagaoka' }, { name: '富山', file: 'toyama' },
            { name: '石川', file: 'ishikawa' }, { name: '長野', file: 'nagano' }, { name: '松本', file: 'matsumoto' }
        ]},
        { group: '中部', offices: [
            { name: '福井', file: 'fukui' }, { name: '岐阜', file: 'gifu' }, { name: '飛騨', file: 'hida' },
            { name: '静岡', file: 'shizuoka' }, { name: '浜松', file: 'hamamatsu' }, { name: '沼津', file: 'numazu' },
            { name: '名古屋', file: 'aichi' }, { name: '豊橋', file: 'toyohashi' }, { name: '岡崎', file: 'nishimikawa' },
            { name: '小牧', file: 'komaki' }, { name: '三重', file: 'mie' }
        ]},
        { group: '近畿', offices: [
            { name: '滋賀', file: 'shiga' }, { name: '京都', file: 'kyoto' }, { name: '大阪', file: 'osaka' },
            { name: 'なにわ', file: 'naniwa' }, { name: '和泉', file: 'izumi' }, { name: '奈良', file: 'nara' },
            { name: '和歌山', file: 'wakayama' }, { name: '神戸', file: 'hyogo' }, { name: '姫路', file: 'himeji' }
        ]},
        { group: '中国', offices: [
            { name: '鳥取', file: 'tottori' }, { name: '島根', file: 'shimane' }, { name: '岡山', file: 'okayama' },
            { name: '広島', file: 'hiroshima' }, { name: '福山', file: 'fukuyama' }, { name: '山口', file: 'yamaguchi' }
        ]},
        { group: '四国', offices: [
            { name: '徳島', file: 'tokushima' }, { name: '香川', file: 'kagawa' }, { name: '愛媛', file: 'ehime' }, { name: '高知', file: 'kochi' }
        ]},
        { group: '九州', offices: [
            { name: '福岡', file: 'fukuoka' }, { name: '北九州', file: 'kitakyusyu' }, { name: '久留米', file: 'kurume' },
            { name: '筑豊', file: 'chikuho' }, { name: '佐賀', file: 'saga' }, { name: '長崎', file: 'nagasaki' },
            { name: '佐世保', file: 'sasebo' }, { name: '厳原', file: 'izuhara' }, { name: '熊本', file: 'kumamoto' },
            { name: '大分', file: 'oita' }, { name: '宮崎', file: 'miyazaki' }, { name: '鹿児島', file: 'kagoshima' }, { name: '奄美', file: 'amami' }
        ]},
        { group: '沖縄', offices: [
            { name: '沖縄', file: 'rikuun' }, { name: '宮古', file: 'miyako' }, { name: '八重山', file: 'yaeyama' }
        ]}
    ];

    const CSV_BASE = 'https://mochibullet.github.io/address-code/data/';
    let fetchCache = {};
    let currentData = [];
    let currentOffice = '';
    let lastResult = null;

    // === Build region buttons ===
    const regionList = document.getElementById('regionList');
    regions.forEach(r => {
        const group = document.createElement('div');
        group.className = 'region-group';
        group.innerHTML = '<div class="region-group-title">' + r.group + '</div>';
        const grid = document.createElement('div');
        grid.className = 'region-grid';
        r.offices.forEach(o => {
            const btn = document.createElement('button');
            btn.className = 'region-btn';
            btn.textContent = o.name;
            btn.addEventListener('click', () => openOffice(o));
            grid.appendChild(btn);
        });
        group.appendChild(grid);
        regionList.appendChild(group);
    });

    // === Modal ===
    const overlay = document.getElementById('modalOverlay');
    const modalBody = document.getElementById('modalBody');
    const modalTitle = document.getElementById('modalTitle');
    const modalBack = document.getElementById('modalBack');
    const modalClose = document.getElementById('modalClose');
    const resultBar = document.getElementById('resultBar');

    modalClose.addEventListener('click', closeModal);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

    function openModal() { overlay.classList.add('show'); }
    function closeModal() { overlay.classList.remove('show'); }

    // === Flow: Office → City → Town → Result ===

    async function openOffice(office) {
        currentOffice = office.name;
        modalTitle.textContent = office.name + ' — 読み込み中...';
        modalBack.style.visibility = 'hidden';
        modalBody.innerHTML = '<div class="loading-msg"><div class="spinner"></div><br>データを取得中...</div>';
        openModal();

        try {
            let text;
            if (fetchCache[office.file]) {
                text = fetchCache[office.file];
            } else {
                const res = await fetch(CSV_BASE + office.file + '.csv');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const buf = await res.arrayBuffer();
                text = new TextDecoder('shift-jis').decode(buf);
                fetchCache[office.file] = text;
            }
            currentData = parseCSV(text);
            showCityStep();
        } catch (e) {
            modalTitle.textContent = office.name;
            modalBody.innerHTML = '<div class="loading-msg" style="color:#f66;">データ取得に失敗しました<br>' + e.message + '</div>';
        }
    }

    function showCityStep() {
        modalTitle.textContent = currentOffice + ' — 市区町村';
        modalBack.style.visibility = 'hidden';

        // Extract unique cities
        const cityMap = new Map();
        currentData.forEach(d => {
            if (!cityMap.has(d.city)) cityMap.set(d.city, { code: d.cityCode, count: 0 });
            cityMap.get(d.city).count++;
        });

        let html = '<div class="step-search"><div class="step-search-wrap"><span class="step-search-icon">🔍</span><input type="text" id="citySearch" placeholder="市区町村を検索"></div></div>';
        html += '<div id="cityList">';
        cityMap.forEach((info, name) => {
            html += '<div class="list-item" data-city="' + name + '"><div><span class="list-item-name">' + name + '</span><br><span class="list-item-sub">' + info.count + '件</span></div><span class="list-item-arrow">›</span></div>';
        });
        html += '</div>';
        modalBody.innerHTML = html;

        // City click
        modalBody.querySelectorAll('.list-item').forEach(item => {
            item.addEventListener('click', () => showTownStep(item.dataset.city));
        });

        // City search
        const citySearch = document.getElementById('citySearch');
        citySearch.focus();
        citySearch.addEventListener('input', () => {
            const q = citySearch.value.trim().toLowerCase();
            modalBody.querySelectorAll('#cityList .list-item').forEach(item => {
                item.style.display = item.dataset.city.toLowerCase().includes(q) ? '' : 'none';
            });
        });
    }

    function showTownStep(city) {
        modalTitle.textContent = city;
        modalBack.style.visibility = 'visible';
        modalBack.onclick = () => showCityStep();

        const towns = currentData.filter(d => d.city === city);

        let html = '<div class="step-search"><div class="step-search-wrap"><span class="step-search-icon">🔍</span><input type="text" id="townSearch" placeholder="町名を検索"></div><div class="step-count" id="townCount">' + towns.length + '件</div></div>';
        html += '<div id="townList">';
        towns.forEach(d => {
            const code = d.cityCode + '-' + d.townCode + (d.subCode ? '-' + d.subCode : '');
            html += '<div class="list-item" data-idx="' + currentData.indexOf(d) + '"><span class="list-item-name">' + d.town + '</span><span class="list-item-code">' + code + '</span></div>';
        });
        html += '</div>';
        modalBody.innerHTML = html;

        // Town click
        modalBody.querySelectorAll('#townList .list-item').forEach(item => {
            item.addEventListener('click', () => {
                const d = currentData[parseInt(item.dataset.idx)];
                selectResult(d);
            });
        });

        // Town search
        const townSearch = document.getElementById('townSearch');
        townSearch.focus();
        townSearch.addEventListener('input', () => {
            const q = townSearch.value.trim();
            let visible = 0;
            modalBody.querySelectorAll('#townList .list-item').forEach(item => {
                const d = currentData[parseInt(item.dataset.idx)];
                const match = d.town.includes(q) || d.kana.includes(q);
                item.style.display = match ? '' : 'none';
                if (match) visible++;
            });
            document.getElementById('townCount').textContent = visible + '件';
        });
    }

    function selectResult(d) {
        lastResult = d;
        const fullCode = d.cityCode + '-' + d.townCode + (d.subCode ? '-' + d.subCode : '');

        // Show in modal
        modalTitle.textContent = '住所コード';
        modalBack.style.visibility = 'visible';
        modalBack.onclick = () => showTownStep(d.city);

        modalBody.innerHTML =
            '<div class="modal-result">' +
                '<div class="modal-result-code">' + fullCode + '</div>' +
                '<div class="modal-result-addr">' + d.city + ' ' + d.town + '</div>' +
                '<div class="modal-result-tags">' +
                    '<span class="modal-result-tag">市区郡: ' + d.cityCode + '</span>' +
                    '<span class="modal-result-tag">町村: ' + d.townCode + '</span>' +
                    (d.subCode ? '<span class="modal-result-tag">小字: ' + d.subCode + '</span>' : '') +
                '</div>' +
                '<div class="modal-result-btns">' +
                    '<button class="btn btn-primary" onclick="copyAndClose()">📋 コピーして閉じる</button>' +
                    '<button class="btn" onclick="showTownStep(\'' + d.city.replace(/'/g, "\\'") + '\')">← 町名に戻る</button>' +
                '</div>' +
            '</div>';

        // Update sticky bar
        document.getElementById('barCode').textContent = fullCode;
        document.getElementById('barAddr').textContent = d.city + ' ' + d.town;
        document.getElementById('barDetail').innerHTML =
            '<span class="result-tag">市区郡: ' + d.cityCode + '</span>' +
            '<span class="result-tag">町村: ' + d.townCode + '</span>' +
            (d.subCode ? '<span class="result-tag">小字: ' + d.subCode + '</span>' : '');
        resultBar.classList.add('show');
    }

    function copyAndClose() {
        copyCode();
        closeModal();
    }

    // === CSV Parser ===
    function parseCSV(text) {
        const lines = text.split('\n');
        const data = [];
        for (let i = 1; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;
            const cols = parseCSVLine(line);
            if (cols.length >= 5) {
                data.push({
                    kana: cols[0],
                    city: cols[1],
                    town: cols[2],
                    cityCode: cols[3],
                    townCode: cols[4],
                    subCode: cols[5] || ''
                });
            }
        }
        return data;
    }

    function parseCSVLine(line) {
        const result = [];
        let current = '';
        let inQuote = false;
        for (let i = 0; i < line.length; i++) {
            const ch = line[i];
            if (inQuote) {
                if (ch === '"') {
                    if (i + 1 < line.length && line[i + 1] === '"') { current += '"'; i++; }
                    else inQuote = false;
                } else current += ch;
            } else {
                if (ch === '"') inQuote = true;
                else if (ch === ',') { result.push(current); current = ''; }
                else current += ch;
            }
        }
        result.push(current);
        return result;
    }

    // === Copy ===
    function copyCode() {
        if (!lastResult) return;
        const raw = lastResult.cityCode + lastResult.townCode + lastResult.subCode;
        navigator.clipboard.writeText(raw).then(() => {
            showToast(raw + ' をコピーしました');
        });
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 1800);
    }
    </script>
</body>
</html>
